<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08201a; --panel:rgba(13,42,32,.72); --panel2:rgba(255,255,255,.04);
    --brd:rgba(150,220,190,.18); --ink:#eaf4ee; --dim:#9ec0b1;
    --acc:#86c34a; --amber:#e4ab3d; --grey:#7d94a0; --rust:#d15840; --cyan:#46b4cf; --viol:#ab7ecb;
    --nav:#0a271e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(120% 60% at 50% -10%,#0d3227 0%,var(--bg) 55%);
    min-height:100vh;padding-bottom:76px}
  h1,h2,h3,.cond{font-family:"Oswald",sans-serif}

  header.top{position:sticky;top:0;z-index:20;padding:14px 16px 12px;
    background:linear-gradient(180deg,#0a271e 0%,rgba(10,39,30,.92) 100%);
    border-bottom:1px solid var(--brd);backdrop-filter:blur(6px)}
  .top .brand{font-family:"Oswald";font-weight:700;text-transform:uppercase;
    letter-spacing:.14em;font-size:13px;color:var(--dim)}
  .top h1{margin:2px 0 0;font-size:22px;font-weight:600;letter-spacing:.01em}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .sync-btn{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--brd);
    background:var(--panel2);color:var(--dim);font-size:18px;cursor:pointer;margin-top:2px}
  .sync-btn.on{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 55%,transparent);
    background:color-mix(in srgb,var(--acc) 14%,transparent)}
  .sync-status{font-size:11.5px;color:var(--dim);margin-top:7px;min-height:14px}
  .sync-status.err{color:#e79b8f} .sync-status.ok{color:var(--acc)}

  main{padding:16px;max-width:560px;margin:0 auto}
  .tab{display:none}.tab.on{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
  .sec-head h2{margin:0;font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .add{background:var(--acc);color:#08201a;border:none;border-radius:9px;
    font-family:"Oswald";font-weight:600;font-size:13px;letter-spacing:.03em;
    padding:8px 13px;cursor:pointer;text-transform:uppercase}
  .add:active{transform:scale(.96)}

  .card{background:var(--panel);border:1px solid var(--brd);border-radius:13px;
    padding:14px;margin-bottom:12px;box-shadow:0 10px 24px -18px rgba(0,0,0,.8)}
  .card .ttl{font-family:"Oswald";font-weight:600;font-size:16px;letter-spacing:.02em;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-family:"Oswald";font-weight:600;font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;padding:2px 8px;border-radius:20px;
    background:color-mix(in srgb,var(--c,#7d94a0) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--c,#7d94a0) 55%,transparent);color:var(--ink)}
  .b-encurs{--c:var(--acc)} .b-propera{--c:var(--amber)} .b-passada{--c:var(--grey)}
  .b-build{--c:var(--acc)} .b-caixa{--c:var(--amber)} .b-perif{--c:var(--cyan)}

  .field{margin-top:10px}
  .field .lab{font-family:"Oswald";text-transform:uppercase;letter-spacing:.1em;
    font-size:10.5px;color:var(--dim);margin-bottom:2px}
  .field .val{font-size:14px;line-height:1.45;white-space:pre-wrap}
  .row-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .mini{background:var(--panel2);border:1px solid var(--brd);color:var(--ink);
    border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:500;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px}
  .mini:active{transform:scale(.96)}
  .mini.gc{border-color:color-mix(in srgb,var(--cyan) 50%,transparent);color:#bfe9f3}
  .mini.ics{border-color:color-mix(in srgb,var(--acc) 50%,transparent);color:#cfeba8}
  .mini.del{border-color:color-mix(in srgb,var(--rust) 45%,transparent);color:#f0b3a6}

  .mstone{display:flex;gap:12px;align-items:flex-start}
  .mdate{flex:none;text-align:center;background:var(--panel2);border:1px solid var(--brd);
    border-radius:10px;padding:8px 10px;min-width:58px}
  .mdate .d{font-family:"Oswald";font-weight:700;font-size:20px;line-height:1}
  .mdate .m{font-family:"Oswald";text-transform:uppercase;font-size:10.5px;color:var(--dim);letter-spacing:.08em}
  .mdate .y{font-size:10px;color:var(--dim)}
  .mstone.done{opacity:.5}
  .mstone.done .ttl{text-decoration:line-through}

  .pl-list{display:grid;gap:9px}
  .pl{display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--brd);border-radius:11px;padding:10px 12px}
  .pl .nm{font-family:"Oswald";font-weight:600;font-size:14.5px;flex:1;min-width:0}
  .pl .meta{font-size:11.5px;color:var(--dim);margin-top:1px;font-family:"Inter"}
  .pl .skills{font-size:11px;color:#bcd6c8;margin-top:3px;font-family:"Oswald";letter-spacing:.03em}
  .pl .tsi{font-family:"Oswald";font-weight:600;font-size:13px;color:var(--dim);white-space:nowrap}
  .grp-h{font-family:"Oswald";text-transform:uppercase;letter-spacing:.1em;font-size:11px;
    color:var(--dim);margin:14px 0 6px;display:flex;align-items:center;gap:8px}
  .grp-h::after{content:"";flex:1;height:1px;background:var(--brd)}

  .empty{color:var(--dim);font-size:13px;text-align:center;padding:26px 10px;
    border:1px dashed var(--brd);border-radius:12px}
  .card.arch{opacity:.7}
  .arch-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;
    background:var(--panel2);border:1px solid var(--brd);color:var(--dim);border-radius:11px;
    padding:12px 14px;margin:6px 0 12px;cursor:pointer;font-family:"Oswald";
    text-transform:uppercase;letter-spacing:.06em;font-size:12.5px}
  .arch-toggle:active{transform:scale(.99)}
  .arch-list{display:none} .arch-list.open{display:block}
  .season-status{margin-top:8px;padding:8px 11px;border-radius:9px;
    background:rgba(134,195,74,.1);border:1px solid rgba(134,195,74,.3)}
  .season-status b{font-family:"Oswald";font-weight:600;letter-spacing:.02em;font-size:13px}
  .season-status .sub{color:var(--dim);font-size:11.5px;margin-top:3px}
  .ov.pit{align-items:stretch}
  .pitsheet{background:#0a241b;width:100%;max-width:560px;height:100%;overflow:auto;padding:14px 14px 34px}
  .pit-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}
  .pit-title{font-family:"Oswald";font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
  .pit-sub{font-size:12px;color:var(--dim);margin-top:2px}
  .pit-close{background:var(--panel2);border:1px solid var(--brd);color:var(--ink);border-radius:9px;width:38px;height:38px;font-size:16px;cursor:pointer;flex:none}
  .pit-forms{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .pit-forms button{background:var(--panel2);border:1px solid var(--brd);color:var(--dim);border-radius:20px;padding:6px 12px;font-family:"Oswald";font-size:12px;letter-spacing:.04em;cursor:pointer}
  .pit-forms button.on{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:var(--acc);color:var(--ink)}
  .pitch-mini{position:relative;width:100%;max-width:430px;margin:0 auto;aspect-ratio:5/7;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(0deg,#12503a 0 9.09%,#0f4634 9.09% 18.18%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
  .pitch-mini svg{position:absolute;inset:0;width:100%;height:100%}
  .tok{position:absolute;transform:translate(-50%,-50%);width:clamp(50px,15vw,64px);cursor:pointer;text-align:center;z-index:2}
  .tok .circ{width:34px;height:34px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-family:"Oswald";font-weight:600;font-size:10.5px;border:2px solid rgba(255,255,255,.5);position:relative;color:#eef}
  .tok .nm{font-size:10px;margin-top:3px;line-height:1.1;color:#eef;text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tok.empty .circ{border-style:dashed;color:var(--dim);background:rgba(255,255,255,.06)}
  .tok.c100 .circ{background:#2f6b45;border-color:var(--acc)}
  .tok.c50 .circ{background:#245c6b;border-color:var(--cyan)}
  .tok.cred .circ{background:#5a2420;border-color:#d0423a}
  .tok.cgrey .circ{background:#33403f;border-color:#7d94a0}
  .tok.empty.c100 .circ{background:rgba(134,195,74,.14)}
  .tok.empty.c50 .circ{background:rgba(70,180,207,.14)}
  .tok.empty.cred .circ{background:rgba(208,66,58,.15)}
  .tok.empty.cgrey .circ{background:rgba(125,148,160,.12)}
  .tok.sign .circ{background:#0b0e0c !important}
  .tok .pb{position:absolute;top:-7px;right:-9px;font-size:8.5px;font-weight:700;font-family:"Oswald";padding:1px 4px;border-radius:8px;color:#08201a}
  .tok .pb.p100{background:var(--acc)} .tok .pb.p50{background:var(--cyan)}
  .pit-controls{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--brd);border-radius:9px;overflow:hidden}
  .seg button{background:none;border:none;color:var(--dim);padding:8px 16px;font-family:"Oswald";font-size:13px;letter-spacing:.04em;cursor:pointer}
  .seg button.on{background:color-mix(in srgb,var(--acc) 24%,transparent);color:var(--ink)}
  .compete-btn{border:1px solid var(--brd);border-radius:9px;padding:8px 14px;font-family:"Oswald";font-size:12.5px;letter-spacing:.03em;cursor:pointer;background:var(--panel2)}
  .compete-btn.off{color:#e79b8f;border-color:rgba(208,66,58,.5)}
  .compete-btn.on{color:#aec3ce;border-color:rgba(125,148,160,.5)}
  .pit-legend{font-size:11px;color:var(--dim);text-align:center;margin-top:9px}
  .tp-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
  .tpc{font-size:11px;font-weight:600;font-family:"Oswald";letter-spacing:.02em;padding:3px 8px;border-radius:20px;border:1px solid}
  .tpc.g{background:color-mix(in srgb,var(--acc) 18%,transparent);border-color:color-mix(in srgb,var(--acc) 55%,transparent);color:#cfeba8}
  .tpc.b{background:color-mix(in srgb,var(--cyan) 18%,transparent);border-color:color-mix(in srgb,var(--cyan) 55%,transparent);color:#bfe9f3}
  .tpc.k{background:#0b0e0c;border-color:#555;color:#ddd}
  .pit-summary{margin-top:16px;display:grid;gap:8px}
  .sm-row{font-size:12.5px;line-height:1.5}
  .sm-row b{font-family:"Oswald";text-transform:uppercase;letter-spacing:.05em;font-size:11px}
  .sm-100 b{color:var(--acc)} .sm-50 b{color:var(--amber)} .sm-sign b{color:#cfcfcf}

  /* bottom nav */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
    background:var(--nav);border-top:1px solid var(--brd);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  nav.tabs button{flex:1;background:none;border:none;color:var(--dim);
    padding:7px 2px;cursor:pointer;font-family:"Oswald";font-weight:500;
    text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;
    display:flex;flex-direction:column;align-items:center;gap:3px}
  nav.tabs button .ic{font-size:19px;line-height:1}
  nav.tabs button.on{color:var(--acc)}

  /* modal */

const KEY="ht_roadmap_v2";
const hasCloud = !!(window.storage && window.storage.get);
const hasLS = (()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true;}catch(e){return false;}})();
let state=null, sheetSave=null;
const uid=()=>Math.random().toString(36).slice(2,9);
const MONTHS=["gen","feb","mar","abr","mai","jun","jul","ago","set","oct","nov","des"];

/* ---------- seed with Carlos's real data ---------- */
function seed(){return{
 seasons:[

 players:[

 ]
};}

/* ---------- storage ---------- */
async function load(){
  if(hasCloud){
    try{const r=await window.storage.get(KEY,false);state=JSON.parse(r.value);return;}
    catch(e){state=seed();await save();return;}
  }
  if(hasLS){
    const v=localStorage.getItem(KEY);
    if(v){try{state=JSON.parse(v);return;}catch(e){}}
    state=seed();await save();return;
  }
  document.getElementById('warn-store').style.display='block';state=seed();
}
async function persistLocal(){
  if(hasCloud){try{await window.storage.set(KEY,JSON.stringify(state),false);return;}catch(e){}}
  if(hasLS){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
}
let _pushTimer=null;
async function save(){
  state._ts=Date.now();
  await persistLocal();
  if(syncEnabled()){clearTimeout(_pushTimer);_pushTimer=setTimeout(pushSync,800);}
}
/* ---------- cloud sync (Supabase) ---------- */
const DEFAULT_SYNC={on:true,url:'https://ehgstsggxrbuccpwajbf.supabase.co',key:'sb_publishable_E2dIaA6P0vajxcJuVpmYZA_JOhEcv3y',code:'ht-u2fsfqdy'};
function syncCfg(){
  let c={};
  try{const raw=localStorage.getItem('ht_sync_cfg');if(raw)c=JSON.parse(raw);}catch(e){}
  if(!c.url&&!c.key&&!c.code)return {...DEFAULT_SYNC};
  return c;
}
function syncEnabled(){const c=syncCfg();return !!(c.on&&c.url&&c.key&&c.code);}
function genCode(){return 'ht-'+Math.random().toString(36).slice(2,10);}
function sbHeaders(c){return {'apikey':c.key,'Authorization':'Bearer '+c.key,'Content-Type':'application/json'};}
function sbBase(c){return c.url.replace(/\/+$/,'')+'/rest/v1/ht_state';}
async function remoteGet(){const c=syncCfg();
  const res=await fetch(sbBase(c)+'?id=eq.'+encodeURIComponent(c.code)+'&select=data,updated_at',{headers:sbHeaders(c)});
  if(!res.ok){let t='';try{t=await res.text();}catch(e){}throw new Error(res.status+' '+t.slice(0,150));}
  const arr=await res.json();return (arr&&arr[0])?arr[0]:null;}
async function remotePut(st){const c=syncCfg();
  const res=await fetch(sbBase(c),{method:'POST',headers:{...sbHeaders(c),'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{id:c.code,data:st,updated_at:new Date().toISOString()}])});
  if(!res.ok){let t='';try{t=await res.text();}catch(e){}throw new Error(res.status+' '+t.slice(0,150));}}
function setSyncStatus(t,kind){const el=document.getElementById('sync-status');if(!el)return;
  el.textContent=t;el.className='sync-status'+(kind?(' '+kind):'');
  clearTimeout(setSyncStatus._t);
  if(kind!=='err')setSyncStatus._t=setTimeout(()=>{el.textContent='';el.className='sync-status';},4500);}
function renderSyncBtn(){const b=document.getElementById('sync-btn');if(b)b.className='sync-btn'+(syncEnabled()?' on':'');}
async function pushSync(){if(!syncEnabled())return;
  try{await remotePut(state);setSyncStatus('Sincronitzat ✓','ok');}catch(e){setSyncStatus('Error '+(e&&e.message||e),'err');}}
async function pullSync(){if(!syncEnabled())return;setSyncStatus('Sincronitzant…');
  try{const r=await remoteGet();
    if(!r||!r.data){await remotePut(state);setSyncStatus('Pujat al núvol ✓','ok');return;}
    const rTs=r.data._ts||0,lTs=state._ts||0;
    if(rTs>lTs){state=r.data;await persistLocal();render();renderSyncBtn();setSyncStatus('Actualitzat des del núvol ✓','ok');}
    else if(lTs>rTs){await remotePut(state);setSyncStatus('Sincronitzat ✓','ok');}
    else setSyncStatus('Al dia ✓','ok');
  }catch(e){setSyncStatus('Error '+(e&&e.message||e),'err');}}
function openSync(){const c=syncCfg();
  openSheet('Sincronització al núvol',[
    {k:'on',lab:'Activar sincronització',type:'select',opts:[['','No'],['1','Sí']]},
    {k:'url',lab:'URL del projecte Supabase'},
    {k:'key',lab:'Clau anon (public)'},
    {k:'code',lab:'Codi de sync (igual als 2 aparells)'}
  ],{on:c.on?'1':'',url:c.url||'',key:c.key||'',code:c.code||genCode()},async(out)=>{
    const cfg={on:out.on==='1',url:(out.url||'').trim(),key:(out.key||'').trim(),code:(out.code||'').trim()};
    try{localStorage.setItem('ht_sync_cfg',JSON.stringify(cfg));}catch(e){setSyncStatus('Aquest entorn no desa la config (fes-ho a la versió publicada)','err');}
    renderSyncBtn();
    if(cfg.on&&cfg.url&&cfg.key&&cfg.code)await pullSync();
  });}

/* ---------- nav ---------- */
function go(btn){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const t=btn.dataset.tab;
  document.querySelectorAll('.tab').forEach(s=>s.classList.remove('on'));
  document.getElementById('t-'+t).classList.add('on');
  document.getElementById('page-title').textContent=btn.dataset.title;
  window.scrollTo(0,0);
}

/* ---------- render ---------- */
function esc(s){return (s||"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function badgeClass(e){return e==='En curs'?'b-encurs':e==='Propera'?'b-propera':'b-passada';}

function render(){renderSeasons();renderMiles();renderSquad();renderRefs();}

function _sat(d){return new Date(d+'T12:00:00');}
function _add(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function _fmt(d){return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear();}
function _iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function seasonDates(s){
  if(!s.jornada||!s.dataJornada)return null;
  const anchor=_sat(s.dataJornada);
  const start=_add(anchor,-((s.jornada-1)*7));   // jornada 1
  const end=_add(start,13*7);                     // jornada 14
  const nextStart=_add(end,21);                   // pròxima temporada (2 setmanes off)
  return {start,end,nextStart};
}
function seasonLive(s){
  const D=seasonDates(s); if(!D)return null;
  const now=new Date(); now.setHours(12,0,0,0);
  const wk=Math.floor((now-D.start)/(7*864e5));
  let phase='live',jornada=null,offw=null;
  if(now<D.start)phase='upcoming';
  else if(wk<=13){phase='live';jornada=wk+1;}
  else if(wk<=15){phase='off';offw=wk-13;}
  else phase='done';
  return {phase,jornada,offw,start:_fmt(D.start),end:_fmt(D.end),nextStart:_fmt(D.nextStart)};
}
function statusLine(s){
  const L=seasonLive(s);
  if(L){
    const head=`T${s.temporada||'?'}${s.divisio?' · '+esc(s.divisio):''}`;
    if(L.phase==='upcoming')
      return `<div class="season-status"><b>${head}</b><div class="sub">Comença: ${L.start} · Fi lliga: ${L.end} · Nova temp.: ${L.nextStart}</div></div>`;
    const pos=L.phase==='live'?`Jornada ${L.jornada}/14`:L.phase==='off'?`Off-season (${L.offw}/2)`:'Temporada acabada';
    const sub=`Inici: ${L.start} · Fi lliga: ${L.end}`+(s.estat!=='Passada'?` · Nova temp.: ${L.nextStart}`:'');
    return `<div class="season-status"><b>${head} · ${pos}</b><div class="sub">${sub}</div></div>`;
  }
  if(s.temporada||s.divisio){
    const bits=[s.temporada?'T'+s.temporada:'',s.divisio?esc(s.divisio):'',s.jornada?'Jornada '+s.jornada+'/14':''].filter(Boolean);
    return `<div class="season-status"><b>${bits.join(' · ')}</b></div>`;
  }
  return '';
}
function nextSeasonDefaults(){
  const anch=state.seasons.filter(s=>s.dataJornada&&s.jornada).sort((a,b)=>(+a.temporada||0)-(+b.temporada||0));
  if(!anch.length)return {};
  const last=anch[anch.length-1], D=seasonDates(last), t=(+last.temporada||0)+1;
  return {temporada:t,jornada:1,dataJornada:_iso(D.nextStart),title:'Temporada '+t,estat:'Propera'};
}
function autofillSeasonChain(){
  const seasons=state.seasons.filter(s=>s.temporada).sort((a,b)=>(+a.temporada)-(+b.temporada));
  let changed=false,lastA=null;
  for(const s of seasons){
    if(s.dataJornada&&s.jornada){lastA=s;continue;}
    if(lastA){const D=seasonDates(lastA);s.dataJornada=_iso(D.nextStart);s.jornada=s.jornada||1;changed=true;lastA=s;}
  }
  return changed;
}
function seasonCard(s,arch){
  return `<div class="card${arch?' arch':''}">
     <div class="ttl">${esc(s.title)} <span class="badge ${badgeClass(s.estat)}">${esc(s.estat)}</span></div>
     ${statusLine(s)}
     <div class="field"><div class="lab">Entrenament</div><div class="val">${esc(s.entrenament)||'—'}</div></div>
     ${trainPlanHTML(s)}
     <div class="field"><div class="lab">Competició</div><div class="val">${esc(s.competicio)||'—'}</div></div>
     <div class="field"><div class="lab">Traspassos i fites</div><div class="val">${esc(s.traspassos)||'—'}</div></div>
     <div class="row-actions">
       <button class="mini gc" onclick="openPitch('${s.id}')">⚽ Alineació</button>
       ${arch?'':`<button class="mini" onclick="archiveSeason('${s.id}')">📥 Arxiva</button>`}
       <button class="mini" onclick="editSeason('${s.id}')">✎ Edita</button>
       <button class="mini del" onclick="delItem('seasons','${s.id}')">Elimina</button>
     </div>
   </div>`;
}
function renderSeasons(){
  const el=document.getElementById('seasons');
  if(!state.seasons.length){el.innerHTML='<div class="empty">Encara no hi ha temporades.</div>';return;}
  const active=state.seasons.filter(s=>s.estat!=='Passada');
  const arch=state.seasons.filter(s=>s.estat==='Passada');
  let html=active.map(s=>seasonCard(s,false)).join('')||'<div class="empty">Cap temporada activa.</div>';
  if(arch.length){
    html+=`<button class="arch-toggle" onclick="toggleArchive()"><span>📁 Temporades anteriors (${arch.length})</span><span id="arch-caret">▸</span></button><div id="arch-list" class="arch-list">${arch.map(s=>seasonCard(s,true)).join('')}</div>`;
  }
  el.innerHTML=html;
}
async function archiveSeason(id){const s=state.seasons.find(x=>x.id===id);if(s){s.estat='Passada';await save();renderSeasons();}}
function toggleArchive(){const l=document.getElementById('arch-list'),c=document.getElementById('arch-caret');if(!l)return;const open=l.classList.toggle('open');if(c)c.textContent=open?'▾':'▸';}

function renderMiles(){
  const el=document.getElementById('miles');
  const arr=[...state.miles].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(!arr.length){el.innerHTML='<div class="empty">Cap fita marcada.</div>';return;}
  el.innerHTML=arr.map(m=>{
    const[y,mo,d]=(m.date||'2026-01-01').split('-');
    return `<div class="card mstone ${m.done?'done':''}">
      <div class="mdate"><div class="d">${d||'--'}</div><div class="m">${MONTHS[(+mo||1)-1]}</div><div class="y">${y||''}</div></div>
      <div style="flex:1;min-width:0">
        <div class="ttl">${esc(m.title)}</div>
        ${m.season?`<div class="meta" style="font-size:11.5px;color:var(--dim);margin-top:3px">${esc(m.season)}</div>`:''}
        ${m.desc?`<div class="field"><div class="val" style="font-size:13px">${esc(m.desc)}</div></div>`:''}
        <div class="row-actions">
          <button class="mini gc" onclick="toGCal('${m.id}')">📆 Google Cal</button>
          <button class="mini ics" onclick="toICS('${m.id}')">⬇ .ics</button>
          <button class="mini" onclick="toggleDone('${m.id}')">${m.done?'↺ Reobre':'✓ Fet'}</button>
          <button class="mini" onclick="editMile('${m.id}')">✎</button>
          <button class="mini del" onclick="delItem('miles','${m.id}')">✕</button>
        </div>
      </div></div>`;
  }).join('');
}

const ROLBADGE={build:['b-build','Build'],caixa:['b-caixa','Caixa'],perif:['b-perif','Perifèric']};
function renderSquad(){
  const el=document.getElementById('squad');
  if(!state.players.length){el.innerHTML='<div class="empty">Cap jugador.</div>';return;}
  let html='';
  ['build','caixa','perif'].forEach(rol=>{
    const grp=state.players.filter(p=>p.rol===rol).sort((a,b)=>b.tsi-a.tsi);
    if(!grp.length)return;
    html+=`<div class="grp-h">${ROLBADGE[rol][1]}</div><div class="pl-list">`;
    html+=grp.map(p=>{
      const sk=[['POR','por'],['DEF','def'],['CRE','cre'],['EXT','ext'],['PAS','pas'],['ANO','ano'],['PA','pa']]
        .map(a=>{const v=p[a[1]];return (v&&v>0)?a[0]+' '+v:null;}).filter(Boolean);
      const meta=[esc(p.edat||''),p.aniversari?'aniv '+esc(p.aniversari):'',(p.esp&&p.esp!=='—'&&p.esp!=='')?esc(p.esp):''].filter(Boolean).join(' · ');
      return `<div class="pl">
        <div style="flex:1;min-width:0">

/* ---------- calendar bridge ---------- */
function ymd(dstr){return (dstr||'2026-01-01').replaceAll('-','');}
function nextDay(dstr){const dt=new Date(dstr+'T00:00:00');dt.setDate(dt.getDate()+1);
  return dt.getFullYear()+String(dt.getMonth()+1).padStart(2,'0')+String(dt.getDate()).padStart(2,'0');}
function icsEsc(s){return (s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}

function toGCal(id){
  const m=state.miles.find(x=>x.id===id);if(!m)return;
  const url='https://calendar.google.com/calendar/render?action=TEMPLATE'
    +'&text='+encodeURIComponent(m.title)
    +'&dates='+ymd(m.date)+'/'+nextDay(m.date)
    +'&details='+encodeURIComponent((m.desc||'')+(m.season?'\n['+m.season+']':''));
  window.open(url,'_blank');
}
function toICS(id){
  const m=state.miles.find(x=>x.id===id);if(!m)return;
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//HT Roadmap//CA','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT','UID:'+id+'@ht-roadmap','DTSTAMP:'+ymd(new Date().toISOString().slice(0,10))+'T000000Z',
    'DTSTART;VALUE=DATE:'+ymd(m.date),'DTEND;VALUE=DATE:'+nextDay(m.date),
    'SUMMARY:'+icsEsc(m.title),'DESCRIPTION:'+icsEsc((m.desc||'')+(m.season?' ['+m.season+']':'')),
    'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(m.title),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(m.title.slice(0,24).replace(/[^\w]+/g,'_')||'fita')+'.ics';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}

function openSheet(title,fields,obj,onSave){
  document.getElementById('sheet-title').textContent=title;
  document.getElementById('sheet-body').innerHTML=fields.map(f=>{
    const v=obj[f.k]??'';
    if(f.type==='paste')return `<div class="mf"><label>${f.lab}</label><textarea id="f_${f.k}" placeholder="Copia el jugador a Hattrick i enganxa'l aquí…"></textarea><button type="button" class="mini ics" style="margin-top:8px" onclick="parsePortaretalls()">⚡ Analitza i omple</button></div>`;
    if(f.type==='textarea')return `<div class="mf"><label>${f.lab}</label><textarea id="f_${f.k}">${esc(String(v))}</textarea></div>`;
    if(f.type==='select')return `<div class="mf"><label>${f.lab}</label><select id="f_${f.k}">${f.opts.map(o=>`<option value="${o[0]}" ${o[0]==v?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;
    return `<div class="mf"><label>${f.lab}</label><input id="f_${f.k}" type="${f.type||'text'}" value="${esc(String(v))}"></div>`;
  }).join('');
  sheetSave=()=>{const out={...obj};fields.forEach(f=>{
    if(f.k==='paste')return;
    let val=document.getElementById('f_'+f.k).value;
    if(f.type==='number')val=parseInt(val,10)||0;
    out[f.k]=val;});return onSave(out);};
  document.getElementById('ov').classList.add('on');
}

function parsePortaretalls(){
  const t=(document.getElementById('f_paste')||{}).value||'';
  if(!t.trim())return;
  const set=(k,v)=>{const el=document.getElementById('f_'+k); if(el&&v!==undefined&&v!==null&&v!=='')el.value=v;};
  const clean=s=>s.replace(/\[\/?b\]/g,'').trim();
  let m=t.match(/^(.*?)\s*\[playerid=(\d+)\]/m);
  if(m){set('nom',clean(m[1]));set('htid',m[2]);}
  else{const first=t.split('\n').map(s=>s.trim()).find(Boolean);if(first)set('nom',clean(first.replace(/\[.*?\]/g,'')));}
  m=t.match(/(\d+)\s*anys?\s*i\s*(\d+)\s*dies/i); if(m)set('edat',m[1]+'a '+m[2]+'d');
  m=t.match(/aniversari:\s*(\d{2}-\d{2}-\d{4})/i); if(m)set('aniversari',m[1]);
  m=t.match(/Nacionalitat:\s*([^\n\[]+)/i); if(m)set('nacionalitat',clean(m[1]));
  m=t.match(/TSI:\s*([\d.\s]+)/i); if(m)set('tsi',parseInt(m[1].replace(/[.\s]/g,''),10));
  m=t.match(/\[money\](\d+)\[\/money\]/i); if(m)set('sou',parseInt(m[1],10));
  m=t.match(/Especialitat:\s*([^\n]+)/i); if(m){let e=clean(m[1]); if(e==='-')e=''; set('esp',e);}
  const cells={}; let re=/\[th\](.*?)\[\/th\]\[td\](.*?)\[\/td\]/g, mm;
  while((mm=re.exec(t))){const lab=clean(mm[1]).toLowerCase();const num=(mm[2].match(/\((\d+)\)/)||[])[1];if(num!==undefined)cells[lab]=parseInt(num,10);}
  const map={'porteria':'por','defensa':'def','creativitat':'cre','extrem':'ext','passades':'pas','anotació':'ano','anotacio':'ano','pilota aturada':'pa','forma':'forma','resistència':'resist','resistencia':'resist'};
  Object.keys(cells).forEach(l=>{if(map[l])set(map[l],cells[l]);});
  const extra=[];
  m=t.match(/nivell\s+(.+?)\s+d'experiència/i); if(m)extra.push('Exp: '+clean(m[1]));
  m=t.match(/(classe mundial|\S+)\s+de\s+lideratge/i); if(m)extra.push('Lid: '+clean(m[1]));
  m=t.match(/fidelitat\s+(.+?)[\.\n]/i); if(m)extra.push('Fid: '+clean(m[1]));
  if(extra.length){const n=document.getElementById('f_nota'); if(n&&!n.value.trim())n.value=extra.join(' · ');}
}

/* ---------- lineup / mini-pitch ---------- */
const FORMS={
 '4-4-2':[['POR','POR',50,90],['LD','LD',16,70],['DC1','DC',38,72],['DC2','DC',62,72],['LE','LE',84,70],['ED','ED',15,42],['MI1','MI',39,46],['MI2','MI',61,46],['EE','EE',85,42],['DAV1','DAV',38,16],['DAV2','DAV',62,16]],
 '4-3-3':[['POR','POR',50,90],['LD','LD',16,70],['DC1','DC',38,72],['DC2','DC',62,72],['LE','LE',84,70],['MI1','MI',30,50],['MI2','MI',50,52],['MI3','MI',70,50],['EE','EE',16,20],['DAV1','DAV',50,14],['ED','ED',84,20]],
 '3-5-2':[['POR','POR',50,90],['DC1','DC',30,72],['DC2','DC',50,74],['DC3','DC',70,72],['LD','CAR',12,48],['MI1','MI',34,50],['MI2','MI',50,52],['MI3','MI',66,50],['LE','CAR',88,48],['DAV1','DAV',40,16],['DAV2','DAV',60,16]],
 '4-5-1':[['POR','POR',50,90],['LD','LD',16,70],['DC1','DC',38,72],['DC2','DC',62,72],['LE','LE',84,70],['ED','ED',14,40],['MI1','MI',34,48],['MI2','MI',50,50],['MI3','MI',66,48],['EE','EE',86,40],['DAV1','DAV',50,14]],
 '5-3-2':[['POR','POR',50,90],['LD','CAR',12,68],['DC1','DC',32,72],['DC2','DC',50,74],['DC3','DC',68,72],['LE','CAR',88,68],['MI1','MI',34,48],['MI2','MI',50,50],['MI3','MI',66,48],['DAV1','DAV',40,16],['DAV2','DAV',60,16]]
};
const PITCH_SVG=`<svg viewBox="0 0 100 140" preserveAspectRatio="none" fill="none" stroke="rgba(240,255,248,.5)" stroke-width="0.5"><rect x="3" y="3" width="94" height="134" rx="1.5"/><line x1="3" y1="70" x2="97" y2="70"/><circle cx="50" cy="70" r="11"/><rect x="26" y="3" width="48" height="17"/><rect x="26" y="120" width="48" height="17"/></svg>`;
let pitCurrent=null, pitMatch='lliga';
function ensureLineups(s){
  if(!s.lineups){ s.lineups={lliga:(s.lineup&&s.lineup.slots?s.lineup:{formation:'4-4-2',slots:{}}),copa:{formation:'5-4-1',slots:{}}}; if(s.lineup)delete s.lineup; }
  if(typeof s.compete!=='boolean')s.compete=false;
  ['lliga','copa'].forEach(k=>{ if(!s.lineups[k])s.lineups[k]={formation:'4-4-2',slots:{}}; if(!s.lineups[k].slots)s.lineups[k].slots={}; if(!s.lineups[k].formation)s.lineups[k].formation='4-4-2'; });
  return s.lineups;
}
function shortName(n){if(!n)return '';const w=n.trim().split(/\s+/)[0];return w.length>9?w.slice(0,8)+'…':w;}
function curSeason(){return state.seasons.find(x=>x.id===pitCurrent);}
const TRAIN={
  gk:     {gk:100},
  def:    {cd:100,wb:100},
  defpos: {gk:100,cd:100,wb:100,im:100,w:100},
  pm:     {im:100,w:50},
  cross:  {w:100,wb:50},
  wingatt:{fw:100,w:100},
  sco:    {fw:100},
  shoot:  {cd:100,wb:100,im:100,w:100,fw:100},
  spass:  {im:100,w:100,fw:100},
  tpass:  {cd:100,wb:100,im:100,w:100},
  setp:   {gk:100,cd:100,wb:100,im:100,w:100,fw:100}
};
const TRAIN_LABEL={gk:'Porteria',def:'Defensa',defpos:'Posicions defensives',pm:'Jugades',cross:'Centrades',wingatt:'Atacs per banda',sco:'Anotació',shoot:'Xut',spass:'Passades curtes',tpass:'Passades profunditat',setp:'Pilotes aturades'};
function roleGroup(role){
  if(role==='POR')return 'gk';
  if(role==='DC')return 'cd';
  if(role==='LD'||role==='LE'||role==='CAR')return 'wb';
  if(role==='MI')return 'im';
  if(role==='ED'||role==='EE')return 'w';
  if(role==='DAV')return 'fw';
  return '';}
function seasonTrainCode(s){
  if(s&&s.trainType)return s.trainType;
  const t=(s&&s.entrenament||'').toLowerCase();
  if(/posicions defensives|defensive position/.test(t))return 'defpos';
  if(/defens/.test(t))return 'def';
  if(/jugad|creativ|playmak/.test(t))return 'pm';
  if(/atac.*banda|wing attack/.test(t))return 'wingatt';
  if(/centrad|crossing/.test(t))return 'cross';
  if(/passades curtes|short pass/.test(t))return 'spass';
  if(/profunditat|passades llargues|through pass/.test(t))return 'tpass';
  if(/xut|shooting/.test(t))return 'shoot';
  if(/anotaci|definici|scoring|golej/.test(t))return 'sco';
  if(/porter|keeper/.test(t))return 'gk';
  if(/pilota aturada|pilotes aturades|set piece/.test(t))return 'setp';
  return '';}
function slotPct(role,code){const tbl=TRAIN[code];if(!tbl)return 0;return tbl[roleGroup(role)]||0;}
function slotColorClass(pct,compete){ if(pct===100)return 'c100'; if(pct===50)return 'c50'; return compete?'cgrey':'cred'; }
function openPitch(id){pitCurrent=id;pitMatch='lliga';const s=state.seasons.find(x=>x.id===id);ensureLineups(s);
  document.getElementById('pit-title').textContent='Alineació · '+(s.title||'Temporada');
  document.getElementById('pit-sub').textContent=(s.entrenament?('Entrenament: '+s.entrenament):`Sense entrenament definit.`)+(seasonTrainCode(s)?(' · Pinta: '+TRAIN_LABEL[seasonTrainCode(s)]):'');
  renderControls();renderForms();renderPitch();document.getElementById('pitchov').classList.add('on');}
function closePitch(){document.getElementById('pitchov').classList.remove('on');pitCurrent=null;renderSeasons();}
function renderControls(){const s=curSeason();
  document.getElementById('pit-match').innerHTML=['lliga','copa'].map(m=>`<button class="${m===pitMatch?'on':''}" onclick="setMatch('${m}')">${m==='lliga'?'Lliga':'Copa'}</button>`).join('');
  const c=document.getElementById('pit-compete');
  c.className='compete-btn '+(s.compete?'on':'off');
  c.textContent=s.compete?'● Competint':'● No competint';}
function setMatch(m){pitMatch=m;renderForms();renderPitch();}
async function toggleCompete(){const s=curSeason();s.compete=!s.compete;await save();renderControls();renderPitch();}
function renderForms(){const lu=ensureLineups(curSeason())[pitMatch];
  document.getElementById('pit-forms').innerHTML=Object.keys(FORMS).map(f=>`<button class="${f===lu.formation?'on':''}" onclick="setFormation('${f}')">${f}</button>`).join('');}
async function setFormation(f){ensureLineups(curSeason())[pitMatch].formation=f;await save();renderForms();renderPitch();}
function renderPitch(){const s=curSeason();const lu=ensureLineups(s)[pitMatch];const tt=seasonTrainCode(s);const slots=FORMS[lu.formation]||FORMS['4-4-2'];let html=PITCH_SVG;
  slots.forEach(a=>{const sid=a[0],role=a[1],x=a[2],y=a[3];const d=lu.slots[sid];const pct=slotPct(role,tt);const cc=slotColorClass(pct,s.compete);
    let cls='tok '+cc,inner=role,nm='';
    if(d&&d.toSign){cls+=' sign';nm=(d.label||role)+' ⚑';}
    else if(d&&d.playerId){const pl=state.players.find(pp=>pp.id===d.playerId);cls+=' filled';nm=pl?shortName(pl.nom):'?';}
    else {cls+=' empty';}
    const badge=pct===100?'<span class="pb p100">100</span>':pct===50?'<span class="pb p50">50</span>':'';
    html+=`<div class="${cls}" style="left:${x}%;top:${y}%" onclick="openSlot('${sid}','${role}')"><div class="circ">${inner}${badge}</div>${nm?`<div class="nm">${esc(nm)}</div>`:''}</div>`;});
  document.getElementById('pitch-mini').innerHTML=html;renderPitSummary();}
function renderPitSummary(){const s=curSeason();const tp=trainingPlan(s);
  const row=(c,l,arr)=>arr.length?`<div class="sm-row ${c}"><b>${l}:</b> ${arr.map(esc).join(', ')}</div>`:'';
  const html=row('sm-100','Entrenen 100%',tp.full)+row('sm-50','Entrenen 50%',tp.half)+row('sm-sign','A fitxar',tp.sign.map(x=>x.label));
  document.getElementById('pit-summary').innerHTML=html||`<div class="sm-row" style="color:var(--dim)">Col·loca l'onze de Lliga i de Copa. El color de cada posició es pinta sol segons l'entrenament de la temporada.</div>`;}
function trainingPlan(s){const lus=ensureLineups(s);const tt=seasonTrainCode(s);const full=new Map(),half=new Map(),sign=[];
  ['lliga','copa'].forEach(k=>{const lu=lus[k];const slots=FORMS[lu.formation]||FORMS['4-4-2'];
    slots.forEach(a=>{const sid=a[0],role=a[1];const d=lu.slots[sid];if(!d)return;const pct=slotPct(role,tt);
      if(d.toSign){if(pct>0)sign.push({label:d.label||role,pct});return;}
      const pl=state.players.find(p=>p.id===d.playerId);if(!pl)return;
      if(pct===100)full.set(pl.id,shortName(pl.nom));else if(pct===50)half.set(pl.id,shortName(pl.nom));});});
  half.forEach((v,k)=>{if(full.has(k))half.delete(k);});
  return {full:[...full.values()],half:[...half.values()],sign};}
function trainPlanHTML(s){const tp=trainingPlan(s);
  if(!tp.full.length&&!tp.half.length&&!tp.sign.length)return '';
  const chip=(c,t)=>`<span class="tpc ${c}">${esc(t)}</span>`;
  const parts=[...tp.full.map(n=>chip('g',n)),...tp.half.map(n=>chip('b',n)),...tp.sign.map(x=>chip('k',x.label+' ⚑'))];
  return `<div class="field"><div class="lab">Entrenem (${tp.full.length+tp.half.length})</div><div class="tp-chips">${parts.join('')}</div></div>`;}
function openSlot(sid,role){const lu=ensureLineups(curSeason())[pitMatch];const d=lu.slots[sid]||{};
  const squadOpts=state.players.slice().sort((a,b)=>(b.tsi||0)-(a.tsi||0)).map(p=>[p.id,shortName(p.nom)+' ('+(p.tsi||0)+')']);
  const cur=d.toSign?'__sign':(d.playerId||'');
  openSheet('Posició '+role,[
    {k:'player',lab:'Jugador',type:'select',opts:[['','— buida'],...squadOpts,['__sign','➕ A fitxar (negre)']]},
    {k:'label',lab:'Etiqueta (si és a fitxar, ex. DC)'}
  ],{player:cur,label:(d.label||role)},async(out)=>{
    if(out.player==='')delete lu.slots[sid];
    else if(out.player==='__sign')lu.slots[sid]={toSign:true,label:out.label||role};
    else lu.slots[sid]={playerId:out.player};
    await save();renderPitch();});}
document.getElementById('pitchov').addEventListener('click',e=>{if(e.target.id==='pitchov')closePitch();});
