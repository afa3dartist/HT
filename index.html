<style>
  :root{
    --bg:#08201a; --panel:rgba(13,42,32,.72); --panel2:rgba(255,255,255,.04);
    --brd:rgba(150,220,190,.18); --ink:#eaf4ee; --dim:#9ec0b1;
    --acc:#86c34a; --amber:#e4ab3d; --grey:#7d94a0; --rust:#d15840; --cyan:#46b4cf; --viol:#ab7ecb;
    --nav:#0a271e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(120% 60% at 50% -10%,#0d3227 0%,var(--bg) 55%);
    min-height:100vh;padding-bottom:76px}
  h1,h2,h3,.cond{font-family:"Oswald",sans-serif}

  header.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 12px;
    background:linear-gradient(180deg,#0a271e 0%,rgba(10,39,30,.92) 100%);
    border-bottom:1px solid var(--brd);backdrop-filter:blur(6px)}
  .top .brand{font-family:"Oswald";font-weight:700;text-transform:uppercase;
    letter-spacing:.14em;font-size:13px;color:var(--dim)}
  .top h1{margin:2px 0 0;font-size:22px;font-weight:600;letter-spacing:.01em}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .sync-btn{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--brd);
    background:var(--panel2);color:var(--dim);font-size:18px;cursor:pointer;margin-top:2px}
  .sync-btn.on{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 55%,transparent);
    background:color-mix(in srgb,var(--acc) 14%,transparent)}
  .sync-status{font-size:11.5px;color:var(--dim);margin-top:7px;min-height:14px}
  .sync-status.err{color:#e79b8f} .sync-status.ok{color:var(--acc)}

  main{padding:16px;max-width:560px;margin:0 auto}
  .tab{display:none}.tab.on{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
  .sec-head h2{margin:0;font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .add{background:var(--acc);color:#08201a;border:none;border-radius:9px;
    font-family:"Oswald";font-weight:600;font-size:13px;letter-spacing:.03em;
    padding:8px 13px;cursor:pointer;text-transform:uppercase}
  .add:active{transform:scale(.96)}

  .card{background:var(--panel);border:1px solid var(--brd);border-radius:13px;
    padding:14px;margin-bottom:12px;box-shadow:0 10px 24px -18px rgba(0,0,0,.8)}
  .card .ttl{font-family:"Oswald";font-weight:600;font-size:16px;letter-spacing:.02em;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-family:"Oswald";font-weight:600;font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;padding:2px 8px;border-radius:20px;
    background:color-mix(in srgb,var(--c,#7d94a0) 18%,transparent);
    border:1px solid color-mix(in srgb,var(--c,#7d94a0) 55%,transparent);color:var(--ink)}
  .b-encurs{--c:var(--acc)} .b-propera{--c:var(--amber)} .b-passada{--c:var(--grey)}
  .b-build{--c:var(--acc)} .b-caixa{--c:var(--amber)} .b-perif{--c:var(--cyan)}

  .field{margin-top:10px}
  .field .lab{font-family:"Oswald";text-transform:uppercase;letter-spacing:.1em;
    font-size:10.5px;color:var(--dim);margin-bottom:2px}
  .field .val{font-size:14px;line-height:1.45;white-space:pre-wrap}
  .row-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .mini{background:var(--panel2);border:1px solid var(--brd);color:var(--ink);
    border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:500;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px}
  .mini:active{transform:scale(.96)}
  .mini.gc{border-color:color-mix(in srgb,var(--cyan) 50%,transparent);color:#bfe9f3}
  .mini.ics{border-color:color-mix(in srgb,var(--acc) 50%,transparent);color:#cfeba8}
  .mini.del{border-color:color-mix(in srgb,var(--rust) 45%,transparent);color:#f0b3a6}

  .mstone{display:flex;gap:12px;align-items:flex-start}
  .mdate{flex:none;text-align:center;background:var(--panel2);border:1px solid var(--brd);
    border-radius:10px;padding:8px 10px;min-width:58px}
  .mdate .d{font-family:"Oswald";font-weight:700;font-size:20px;line-height:1}
  .mdate .m{font-family:"Oswald";text-transform:uppercase;font-size:10.5px;color:var(--dim);letter-spacing:.08em}
  .mdate .y{font-size:10px;color:var(--dim)}
  .mstone.done{opacity:.5}
  .mstone.done .ttl{text-decoration:line-through}

  .pl-list{display:grid;gap:9px}
  .pl{display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--brd);border-radius:11px;padding:10px 12px}
  .pl .nm{font-family:"Oswald";font-weight:600;font-size:14.5px;flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .pl .meta{font-size:11.5px;color:var(--dim);margin-top:1px;font-family:"Inter"}
  .pl .skills{font-size:11px;color:#bcd6c8;margin-top:3px;font-family:"Oswald";letter-spacing:.03em}
  .pl .tsi{font-family:"Oswald";font-weight:600;font-size:13px;color:var(--dim);white-space:nowrap}
  .grp-h{font-family:"Oswald";text-transform:uppercase;letter-spacing:.1em;font-size:11px;
    color:var(--dim);margin:14px 0 6px;display:flex;align-items:center;gap:8px}
  .grp-h::after{content:"";flex:1;height:1px;background:var(--brd)}

  .empty{color:var(--dim);font-size:13px;text-align:center;padding:26px 10px;
    border:1px dashed var(--brd);border-radius:12px}
  .card.arch{opacity:.7}
  .arch-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;
    background:var(--panel2);border:1px solid var(--brd);color:var(--dim);border-radius:11px;
    padding:12px 14px;margin:6px 0 12px;cursor:pointer;font-family:"Oswald";
    text-transform:uppercase;letter-spacing:.06em;font-size:12.5px}
  .arch-toggle:active{transform:scale(.99)}
  .arch-list{display:none} .arch-list.open{display:block}
  .season-status{margin-top:8px;padding:8px 11px;border-radius:9px;
    background:rgba(134,195,74,.1);border:1px solid rgba(134,195,74,.3)}
  .season-status b{font-family:"Oswald";font-weight:600;letter-spacing:.02em;font-size:13px}
  .season-status .sub{color:var(--dim);font-size:11.5px;margin-top:3px}
  .ov.pit{align-items:stretch}
  .pitsheet{background:#0a241b;width:100%;max-width:560px;height:100%;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 34px}
  .pit-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}
  .pit-title{font-family:"Oswald";font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
  .pit-sub{font-size:12px;color:var(--dim);margin-top:2px}
  .pit-close{background:var(--panel2);border:1px solid var(--brd);color:var(--ink);border-radius:9px;width:38px;height:38px;font-size:16px;cursor:pointer;flex:none}
  .pit-forms{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .pit-forms button{background:var(--panel2);border:1px solid var(--brd);color:var(--dim);border-radius:20px;padding:6px 12px;font-family:"Oswald";font-size:12px;letter-spacing:.04em;cursor:pointer}
  .pit-forms button.on{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:var(--acc);color:var(--ink)}
  .pitch-mini{position:relative;width:100%;max-width:430px;margin:0 auto;aspect-ratio:5/7;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(0deg,#12503a 0 9.09%,#0f4634 9.09% 18.18%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
  .pitch-mini svg{position:absolute;inset:0;width:100%;height:100%}
  .tok{position:absolute;transform:translate(-50%,-50%);width:clamp(50px,15vw,64px);cursor:pointer;text-align:center;z-index:2}
  .tok .circ{width:34px;height:34px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-family:"Oswald";font-weight:600;font-size:10.5px;border:2px solid rgba(255,255,255,.5);position:relative;color:#eef}
  .tok .nm{font-size:10px;margin-top:3px;line-height:1.1;color:#eef;text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tok.empty .circ{border-style:dashed;color:var(--dim);background:rgba(255,255,255,.06)}
  .tok.c100 .circ{background:#2f6b45;border-color:var(--acc)}
  .tok.c50 .circ{background:#245c6b;border-color:var(--cyan)}
  .tok.cred .circ{background:#5a2420;border-color:#d0423a}
  .tok.cgrey .circ{background:#33403f;border-color:#7d94a0}
  .tok.empty.c100 .circ{background:rgba(134,195,74,.14)}
  .tok.empty.c50 .circ{background:rgba(70,180,207,.14)}
  .tok.empty.cred .circ{background:rgba(208,66,58,.15)}
  .tok.empty.cgrey .circ{background:rgba(125,148,160,.12)}
  .tok.sign .circ{background:#0b0e0c !important}
  .tok .pb{position:absolute;top:-7px;right:-9px;font-size:8.5px;font-weight:700;font-family:"Oswald";padding:1px 4px;border-radius:8px;color:#08201a}
  .tok .pb.p100{background:var(--acc)} .tok .pb.p50{background:var(--cyan)}
  .pit-controls{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--brd);border-radius:9px;overflow:hidden}
  .seg button{background:none;border:none;color:var(--dim);padding:8px 16px;font-family:"Oswald";font-size:13px;letter-spacing:.04em;cursor:pointer}
  .seg button.on{background:color-mix(in srgb,var(--acc) 24%,transparent);color:var(--ink)}
  .compete-btn{border:1px solid var(--brd);border-radius:9px;padding:8px 14px;font-family:"Oswald";font-size:12.5px;letter-spacing:.03em;cursor:pointer;background:var(--panel2)}
  .compete-btn.off{color:#e79b8f;border-color:rgba(208,66,58,.5)}
  .compete-btn.on{color:#aec3ce;border-color:rgba(125,148,160,.5)}
  .pit-legend{font-size:11px;color:var(--dim);text-align:center;margin-top:9px}
  .tp-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
  .tp-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
  .tp-col{min-width:0}
  .tp-h{font-family:"Oswald";text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:var(--dim);margin-bottom:4px}
  .tp-col.c100 .tp-h{color:var(--acc)} .tp-col.c50 .tp-h{color:var(--cyan)}
  .tp-none{color:var(--dim);font-size:12px}
  .tpc{font-size:11px;font-weight:600;font-family:"Oswald";letter-spacing:.02em;padding:3px 8px;border-radius:20px;border:1px solid;display:inline-flex;align-items:center;gap:5px}
  .tpc.g{background:color-mix(in srgb,var(--acc) 18%,transparent);border-color:color-mix(in srgb,var(--acc) 55%,transparent);color:#cfeba8}

async function load(){
  if(hasCloud){
    try{const r=await window.storage.get(KEY,false);state=JSON.parse(r.value);return;}
    catch(e){state=seed();await save();return;}
  }
  if(hasLS){
    const v=localStorage.getItem(KEY);
    if(v){try{state=JSON.parse(v);return;}catch(e){}}
    state=seed();await save();return;
  }
  document.getElementById('warn-store').style.display='block';state=seed();
}
async function persistLocal(){
  if(hasCloud){try{await window.storage.set(KEY,JSON.stringify(state),false);return;}catch(e){}}
  if(hasLS){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
}
let _pushTimer=null;
async function save(){
  state._ts=Date.now();
  await persistLocal();pushSnapshot();
  if(syncEnabled()){clearTimeout(_pushTimer);_pushTimer=setTimeout(pushSync,800);}
}
const DEFAULT_SYNC={on:true,url:'https://ehgstsggxrbuccpwajbf.supabase.co',key:'sb_publishable_E2dIaA6P0vajxcJuVpmYZA_JOhEcv3y',code:'ht-u2fsfqdy'};
function syncCfg(){
  let c={};
  try{const raw=localStorage.getItem('ht_sync_cfg');if(raw)c=JSON.parse(raw);}catch(e){}
  if(!c.url&&!c.key&&!c.code)return {...DEFAULT_SYNC};
  return c;
}
function syncEnabled(){const c=syncCfg();return !!(c.on&&c.url&&c.key&&c.code);}
function genCode(){return 'ht-'+Math.random().toString(36).slice(2,10);}
function sbHeaders(c){return {'apikey':c.key,'Authorization':'Bearer '+c.key,'Content-Type':'application/json'};}
function sbBase(c){return c.url.replace(/\/+$/,'')+'/rest/v1/ht_state';}
async function remoteGet(){const c=syncCfg();
  const res=await fetch(sbBase(c)+'?id=eq.'+encodeURIComponent(c.code)+'&select=data,updated_at',{headers:sbHeaders(c)});
  if(!res.ok){let t='';try{t=await res.text();}catch(e){}throw new Error(res.status+' '+t.slice(0,150));}
  const arr=await res.json();return (arr&&arr[0])?arr[0]:null;}
async function remotePut(st){const c=syncCfg();
  const res=await fetch(sbBase(c),{method:'POST',headers:{...sbHeaders(c),'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{id:c.code,data:st,updated_at:new Date().toISOString()}])});
  if(!res.ok){let t='';try{t=await res.text();}catch(e){}throw new Error(res.status+' '+t.slice(0,150));}}
function setSyncStatus(t,kind){const el=document.getElementById('sync-status');if(!el)return;
  el.textContent=t;el.className='sync-status'+(kind?(' '+kind):'');
  clearTimeout(setSyncStatus._t);
  if(kind!=='err')setSyncStatus._t=setTimeout(()=>{el.textContent='';el.className='sync-status';},4500);}
function renderSyncBtn(){const b=document.getElementById('sync-btn');if(b)b.className='sync-btn'+(syncEnabled()?' on':'');}
async function pushSync(){if(!syncEnabled())return;
  try{await remotePut(state);setSyncStatus('Sincronitzat ✓','ok');}catch(e){setSyncStatus('Error '+(e&&e.message||e),'err');}}
async function pullSync(){if(!syncEnabled())return;setSyncStatus('Sincronitzant…');
  try{const r=await remoteGet();
    if(!r||!r.data){await remotePut(state);setSyncStatus('Pujat al núvol ✓','ok');return;}
    const rTs=r.data._ts||0,lTs=state._ts||0;
    if(rTs>lTs){state=r.data;await persistLocal();render();renderSyncBtn();setSyncStatus('Actualitzat des del núvol ✓','ok');}
    else if(lTs>rTs){await remotePut(state);setSyncStatus('Sincronitzat ✓','ok');}
    else setSyncStatus('Al dia ✓','ok');
  }catch(e){setSyncStatus('Error '+(e&&e.message||e),'err');}}
function openSync(){const c=syncCfg();

    try{localStorage.setItem('ht_sync_cfg',JSON.stringify(cfg));}catch(e){setSyncStatus('Aquest entorn no desa la config (fes-ho a la versió publicada)','err');}
    renderSyncBtn();
    if(cfg.on&&cfg.url&&cfg.key&&cfg.code)await pullSync();

}

function esc(s){return (s||"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function badgeClass(e){return e==='En curs'?'b-encurs':e==='Propera'?'b-propera':'b-passada';}

function render(){renderSeasons();renderLinia();renderAvisosTab();renderSquad();renderRefs();renderCurves();}

function _sat(d){return new Date(d+'T12:00:00');}
function _add(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function _fmt(d){return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear();}
function _iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function seasonDates(s){
  if(!s.jornada||!s.dataJornada)return null;
  const anchor=_sat(s.dataJornada);
  const start=_add(anchor,-((s.jornada-1)*7));
  const end=_add(start,13*7);
  const nextStart=_add(end,21);
  return {start,end,nextStart};
}
function seasonLive(s){
  const D=seasonDates(s); if(!D)return null;
  const now=new Date(); now.setHours(12,0,0,0);
  const wk=Math.floor((now-D.start)/(7*864e5));
  let phase='live',jornada=null,offw=null;
  if(now<D.start)phase='upcoming';
  else if(wk<=13){phase='live';jornada=wk+1;}
  else if(wk<=15){phase='off';offw=wk-13;}
  else phase='done';
  return {phase,jornada,offw,start:_fmt(D.start),end:_fmt(D.end),nextStart:_fmt(D.nextStart)};
}
function statusLine(s){
  const L=seasonLive(s);
  if(L){
    const head=`T${s.temporada||'?'}${s.divisio?' · '+esc(s.divisio):''}`;
    if(L.phase==='upcoming')
      return `<div class="season-status"><b>${head}</b><div class="sub">Comença: ${L.start} · Fi lliga: ${L.end} · Nova temp.: ${L.nextStart}</div></div>`;
    const pos=L.phase==='live'?`Jornada ${L.jornada}/14`:L.phase==='off'?`Off-season (${L.offw}/2)`:'Temporada acabada';
    const sub=`Inici: ${L.start} · Fi lliga: ${L.end}`+(s.estat!=='Passada'?` · Nova temp.: ${L.nextStart}`:'');
    return `<div class="season-status"><b>${head} · ${pos}</b><div class="sub">${sub}</div></div>`;
  }
  if(s.temporada||s.divisio){
    const bits=[s.temporada?'T'+s.temporada:'',s.divisio?esc(s.divisio):'',s.jornada?'Jornada '+s.jornada+'/14':''].filter(Boolean);
    return `<div class="season-status"><b>${bits.join(' · ')}</b></div>`;
  }
  return '';
}
function nextSeasonDefaults(){
  const anch=state.seasons.filter(s=>s.dataJornada&&s.jornada).sort((a,b)=>(+a.temporada||0)-(+b.temporada||0));
  if(!anch.length)return {};
  const last=anch[anch.length-1], D=seasonDates(last), t=(+last.temporada||0)+1;
  return {temporada:t,jornada:1,dataJornada:_iso(D.nextStart),title:'Temporada '+t,estat:'Propera'};
}
function autofillSeasonChain(){
  const seasons=state.seasons.filter(s=>s.temporada).sort((a,b)=>(+a.temporada)-(+b.temporada));
  let changed=false,lastA=null;
  for(const s of seasons){
    if(s.dataJornada&&s.jornada){lastA=s;continue;}
    if(lastA){const D=seasonDates(lastA);s.dataJornada=_iso(D.nextStart);s.jornada=s.jornada||1;changed=true;lastA=s;}
  }
  return changed;
}
function seasonCard(s,arch){
  return `<div class="card${arch?' arch':''}">
     <div class="ttl">${esc(s.title)} <span class="badge ${badgeClass(s.estat)}">${esc(s.estat)}</span></div>
     ${statusLine(s)}
     <div class="field"><div class="lab">Entrenament</div><div class="val">${esc(s.entrenament)||'—'}</div></div>
     ${trainPlanHTML(s)}
     <div class="field"><div class="lab">Competició</div><div class="val">${esc(s.competicio)||'—'}</div></div>
     <div class="field"><div class="lab">Traspassos i fites</div><div class="val">${esc(s.traspassos)||'—'}</div></div>
     <div class="row-actions">
       <button class="mini gc" onclick="openPitch('${s.id}')">⚽ Alineació</button>
       ${arch?'':`<button class="mini" onclick="archiveSeason('${s.id}')">📥 Arxiva</button>`}
       <button class="mini" onclick="editSeason('${s.id}')">✎ Edita</button>
       <button class="mini del" onclick="delItem('seasons','${s.id}')">Elimina</button>
     </div>
   </div>`;
}
function renderSeasons(){

function approxWage(pl){
  const keys=['por','def','cre','ext','pas','ano','pa'];
  const comp=l=>{l=+l||0;return l<=0?0:34*Math.pow(1.5,l);};
  const vals=keys.map(k=>comp(pl[k])*(k==='por'?1.5:1)).sort((a,b)=>b-a);
  const primary=vals[0]||0;const secondary=vals.slice(1).reduce((s,v)=>s+v,0);
  const rate=primary<20000?0.5:0.4;
  let w=250+primary+secondary*rate;
  const age=parseAge(pl.edat);if(age>=29)w*=Math.max(0.5,1-0.08*(age-28));
  if(pl.estranger)w*=1.2;
  return Math.round(w);
}

function parsePortaretalls(){
  const t=(document.getElementById('f_paste')||{}).value||'';
  if(!t.trim())return;
  const set=(k,v)=>{const el=document.getElementById('f_'+k); if(el&&v!==undefined&&v!==null&&v!=='')el.value=v;};
  const clean=s=>s.replace(/\[\/?b\]/g,'').trim();
  let m=t.match(/^(.*?)\s*\[playerid=(\d+)\]/m);
  if(m){set('nom',clean(m[1]));set('htid',m[2]);}
  else{const first=t.split('\n').map(s=>s.trim()).find(Boolean);if(first)set('nom',clean(first.replace(/\[.*?\]/g,'')));}
  m=t.match(/(\d+)\s*anys?\s*i\s*(\d+)\s*dies/i); if(m)set('edat',m[1]+'a '+m[2]+'d');
  m=t.match(/aniversari:\s*(\d{2}-\d{2}-\d{4})/i); if(m)set('aniversari',m[1]);
  m=t.match(/Nacionalitat:\s*([^\n\[]+)/i); if(m)set('nacionalitat',clean(m[1]));
  m=t.match(/TSI:\s*([\d.\s]+)/i); if(m)set('tsi',parseInt(m[1].replace(/[.\s]/g,''),10));
  m=t.match(/\[money\](\d+)\[\/money\]/i); if(m)set('sou',parseInt(m[1],10));
  m=t.match(/Especialitat:\s*([^\n]+)/i); if(m){let e=clean(m[1]); if(e==='-')e=''; set('esp',e);}
  if(/club d'origen|bonificaci[^\n]*club|mother club/i.test(t))set('home','1');
  const cells={}; let re=/\[th\](.*?)\[\/th\]\[td\](.*?)\[\/td\]/g, mm;
  while((mm=re.exec(t))){const lab=clean(mm[1]).toLowerCase();const num=(mm[2].match(/\((\d+)\)/)||[])[1];if(num!==undefined)cells[lab]=parseInt(num,10);}
  const map={'porteria':'por','defensa':'def','creativitat':'cre','extrem':'ext','passades':'pas','anotació':'ano','anotacio':'ano','pilota aturada':'pa','forma':'forma','resistència':'resist','resistencia':'resist'};
  Object.keys(cells).forEach(l=>{if(map[l])set(map[l],cells[l]);});
  const extra=[];
  m=t.match(/nivell\s+(.+?)\s+d'experiència/i); if(m)extra.push('Exp: '+clean(m[1]));
  m=t.match(/(classe mundial|\S+)\s+de\s+lideratge/i); if(m)extra.push('Lid: '+clean(m[1]));
  m=t.match(/fidelitat\s+(.+?)[\.\n]/i); if(m)extra.push('Fid: '+clean(m[1]));
  if(extra.length){const n=document.getElementById('f_nota'); if(n&&!n.value.trim())n.value=extra.join(' · ');}
}

  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//HT//CA','BEGIN:VEVENT','UID:'+uid()+'@ht','DTSTAMP:'+ymd(new Date().toISOString().slice(0,10))+'T000000Z','DTSTART;VALUE=DATE:'+ymd(date),'DTEND;VALUE=DATE:'+nextDay(date),'SUMMARY:'+icsEsc(title),'DESCRIPTION:'+icsEsc(desc||''),'BEGIN:VALARM','TRIGGER:-P'+(+alertDays||1)+'D','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const b=new Blob([ics],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(title.slice(0,20).replace(/[^\w]+/g,'_')||'avis')+'.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}

function itemTitle(x){
  if(x.kind==='train')return 'Entrenament: '+(TRAIN_LABEL[x.trainType]||'');
  if(x.kind==='sale'){const pl=state.players.find(p=>p.id===x.playerId);return 'Vendre '+(pl?pl.nom:(x.title||'jugador'));}
  if(x.kind==='buy')return 'Fitxar '+(x.pos||'');
  return (x.text||'Nota').slice(0,40);
}
function bellHTML(x){return (+x.alert>0)?`<span class="bellchip">🔔 ${alertLabel(x.alert)}</span>`:'';}
function tlActions(x){return `<div class="tl-actions"><button class="mini" onclick="editTimeline('${x.id}')">✎ Edita</button><button class="mini del" onclick="delTimeline('${x.id}')">Elimina</button></div>`;}

      <div class="tl-body"><div class="tl-lab">Forquilla de venda</div><span class="tl-range">${fmtEur(x.priceMin)} – ${fmtEur(x.priceMax)}</span></div>
      <div class="tl-actions">${tlActions(x).replace('<div class="tl-actions">','').replace('</div>','')} ${bellHTML(x)}</div></div>`;
  }
  if(x.kind==='buy'){
    const reqs=(x.reqsText||'').split('\n').map(s=>s.trim()).filter(Boolean);

      <div class="tl-body">
        ${reqs.length?`<div class="tl-lab">Ha de complir</div><div class="tl-reqs">${reqs.map(r=>`<span class="tl-req">${esc(r)}</span>`).join('')}</div>`:''}
        ${x.entrenarem?`<div class="tl-lab">Hi entrenarem</div><span class="tl-train">${esc(x.entrenarem)}</span>`:''}

function avisosHTML(){
  const now=new Date();now.setHours(0,0,0,0);
  const list=(state.timeline||[]).filter(x=>+x.alert>0&&x.date).map(x=>({x,trig:daysBefore(x.date,x.alert)})).sort((a,b)=>a.trig-b.trig);
  if(!list.length)return '<div class="empty">Cap avís de moment. Posa un avís (🔔) a un element de la línia i apareixerà aquí.</div>';
  return list.map(({x})=>{
    const diff=Math.round((new Date(x.date+'T12:00:00')-now)/864e5);
    const big=diff<=0?'ara':(diff<=14?diff:tlDate(x.date).slice(0,5));
    const unit=diff<=0?'':(diff<=14?(diff===1?'dia':'dies'):'');
    const desc=itemTitle(x);
    return `<div class="av"><div class="avd"><div class="n">${big}</div><div class="m">${unit}</div></div>
      <div class="avt"><div class="n">${esc(desc)}</div><div class="s">${tlDate(x.date)} · avís ${alertLabel(x.alert).replace(' abans','')} abans</div></div>
      <div class="avbtns"><button class="mini gc" onclick="calGCal('${esc(desc).replace(/'/g,"")}','${x.date}','')">📆</button><button class="mini ics" onclick="calICS('${esc(desc).replace(/'/g,"")}','${x.date}','',${+x.alert})">.ics</button></div></div>`;
  }).join('');
}
function renderAvisosTab(){const el=document.getElementById('avisos-list');if(el)el.innerHTML=avisosHTML();}

let liniaIdx=-1, tlDefaultDate='', liniaView='list';
function ordSeasons(){return state.seasons.filter(s=>s.temporada).sort((a,b)=>(+a.temporada)-(+b.temporada));}
function seaRange(s){if(s.dataJornada&&s.jornada){const D=seasonDates(s);return{start:D.start,end:D.nextStart};}return null;}
function itemSeaIdx(x,seasons){const d=x.date?new Date(x.date+'T12:00:00'):null;if(!d)return seasons.length-1;
  for(let i=0;i<seasons.length;i++){const R=seaRange(seasons[i]);if(R&&d>=R.start&&d<R.end)return i;}
  for(let i=0;i<seasons.length;i++){const R=seaRange(seasons[i]);if(R&&d<R.start)return i;}
  return seasons.length-1;}
function goSeason(i){liniaIdx=i;renderLinia();}
function setLiniaView(v){liniaView=v;renderLinia();}
const TRAIN_COLOR={gk:'#e4ab3d',def:'#e4ab3d',pm:'#86c34a',wing:'#ab7ecb',pass:'#46b4cf',sco:'#d0665e',setp:'#c9a3d8'};
function calEventChip(x){
  if(x.kind==='note')return `<span class="ev note" onclick="editTimeline('${x.id}')">📝 nota</span>`;

function playerName(id){const p=(state.players||[]).find(x=>x.id===id);return p?p.nom:'?';}
function openWeekTasks(seasonId,n){
  const s=state.seasons.find(x=>x.id===seasonId);if(!s)return;const R=seaRange(s);if(!R)return;
  const wkISO=_iso(_add(R.start,(n-1)*7));
  const items=(state.timeline||[]).filter(x=>(x.kind==='note'||x.kind==='sale'||x.kind==='buy')&&x.date&&(Math.round((new Date(x.date+'T12:00:00')-R.start)/6048e5)+1)===n).sort(tlByOrd);
  const rows=items.map(x=>{
    const ico=x.kind==='note'?'📝':(x.kind==='sale'?'💰':'＋');
    let title;
    if(x.kind==='note')title=esc(x.text||'(nota buida)');
    else if(x.kind==='sale')title='Vendre '+esc(x.playerId?playerName(x.playerId):(x.title||'jugador'))+((x.priceMin||x.priceMax)?' · '+fmtEur(x.priceMin)+'–'+fmtEur(x.priceMax):'');
    else title='Fitxar '+esc(x.pos||'')+(x.reqsText?' · '+esc((''+x.reqsText).split('\n')[0]):'');
    const meta=(+x.alert>0)?('🔔 '+alertLabel(x.alert)):'';
    return `<div class="task"><div class="tico">${ico}</div><div class="tmain"><div class="ttitle">${title}</div>${meta?`<div class="tmeta">${meta}</div>`:''}</div><div class="tacts"><button class="tbtn" onclick="closeSheet();editTimeline('${x.id}')">✎</button><button class="tbtn del" onclick="delWeekTask('${x.id}','${seasonId}',${n})">🗑</button></div></div>`;
  }).join('');
  const nAl=items.filter(x=>+x.alert>0).length;
  document.getElementById('sheet-title').textContent='Jornada '+n;
  document.getElementById('sheet-body').innerHTML=`<div class="psub">${tlDate(wkISO)} · ${items.length} element${items.length!==1?'s':''}${nAl?(' · '+nAl+' avís'+(nAl!==1?'os':'')):''}</div>${rows||'<div class="lp-empty">Cap element aquesta setmana.</div>'}`;
  sheetSave=null;var sv=document.querySelector('.sheet-actions .save');if(sv)sv.style.display='none';
  document.getElementById('ov').classList.add('on');
}
function delWeekTask(id,seasonId,n){confirmSheet('Eliminar aquest element?',async()=>{state.timeline=(state.timeline||[]).filter(x=>x.id!==id);await save();renderLinia();openWeekTasks(seasonId,n);});}
function renderSeasonCalendar(s){
  const R=seaRange(s);if(!R)return '<div class="lp-empty">Aquesta temporada no té dates. Edita-la per fixar-les.</div>';
  const startISO=_iso(R.start),endISO=_iso(R.end);
  const trains=(state.timeline||[]).filter(x=>x.kind==='train'&&x.date&&x.setmanes&&x.date>=startISO&&x.date<endISO);
  const items=(state.timeline||[]).filter(x=>(x.kind==='note'||x.kind==='sale'||x.kind==='buy')&&x.date&&x.date>=startISO&&x.date<endISO);
  const today=new Date();today.setHours(12,0,0,0);
  const todayJorn=(today>=R.start&&today<R.end)?(Math.round((today-R.start)/6048e5)+1):-1;
  const jinfo=[];
  for(let n=1;n<=16;n++){
    let train=null;
    trains.forEach(x=>{const ps=Math.round((new Date(x.date+'T12:00:00')-R.start)/6048e5)+1;const pe=ps+(+x.setmanes)-1;if(n>=ps&&n<=pe)train=x;});
    const evs=items.filter(x=>(Math.round((new Date(x.date+'T12:00:00')-R.start)/6048e5)+1)===n);
    const alerts=(train&&train.alert&&Math.round((new Date(train.date+'T12:00:00')-R.start)/6048e5)+1===n)?1:0;
    jinfo.push({n,jiso:_iso(_add(R.start,(n-1)*7)),train,evs,off:n>14});
  }
  const rows=jinfo.map(a=>{
    const col=a.train?(TRAIN_COLOR[a.train.trainType]||'#7d94a0'):'#3a4a42';
    const tn=a.train?(TRAIN_LABEL[a.train.trainType]||'Entrenament'):(a.off?'— fora de lliga':'—');
    const isT=a.n===todayJorn;const td=isT?' today':'';
    const badge='';
    const evs=a.evs.map(calEventChip).join('');
    const trainHTML=a.train?`<span class="train" onclick="openPhasePitch('${a.train.id}')">${a.off?'<span style="color:var(--dim)">'+tn+'</span>':tn}</span>`:`<span class="train" style="color:var(--dim)">${tn}</span>`;
    const nAl=a.evs.filter(x=>+x.alert>0).length;
    const bell=a.evs.length?`<div class="bellcell"><div class="bell ${nAl?'has':''}" onclick="openWeekTasks('${s.id}',${a.n})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>${nAl?`<span class="cnt">${nAl}</span>`:''}</div></div>`:'';
    return `<div class="jrow${a.off?' off':''}${td}"><div class="jnum"><b>J${a.n}</b><span>${tlDate(a.jiso)}</span></div><div class="jbar" style="background:${col}"></div><div class="jbody">${badge}${trainHTML}${evs}</div>${bell}</div>`;
  }).join('');
  return `<div class="cal">${rows}</div>`;
}

function jornToDate(N){const i=liniaIdx<0?0:liniaIdx;const sv=ordSeasons()[i]||ordSeasons()[0];const R=sv?seaRange(sv):null;return R?_iso(_add(R.start,(Math.max(1,+N)-1)*7)):'';}

function noteCardHTML(x,seasonId){return `<div class="lp-note"><div class="lp-ph-h"><span class="n">📝 Nota</span><span class="d">${jornDateHTML(x.date,seasonId)}</span></div><div style="font-size:12.5px;margin-top:4px">${esc(x.text||'')}</div><div class="tl-actions"><button class="mini" onclick="reorderItem('${x.id}',-1)">↑</button><button class="mini" onclick="reorderItem('${x.id}',1)">↓</button><button class="mini" onclick="editTimeline('${x.id}')">✎</button><button class="mini del" onclick="delTimeline('${x.id}')">✕</button><button class="mini" onclick="copyElement('${x.id}')" title="Copia l'element">⧉</button> ${bellHTML(x)}</div></div>`;}
function tlByOrd(a,b){return ((a.ord==null?1e9:a.ord)-(b.ord==null?1e9:b.ord))||(a.date||'').localeCompare(b.date||'');}
function reorderItem(id,dir){
  const it=(state.timeline||[]).find(x=>x.id===id);if(!it)return;
  const seasons=ordSeasons();const si=itemSeaIdx(it,seasons);
  const peers=(state.timeline||[]).filter(x=>itemSeaIdx(x,seasons)===si).sort(tlByOrd);
  peers.forEach((x,i)=>{x.ord=i;});
  const idx=peers.findIndex(x=>x.id===id);const j=idx+dir;if(j<0||j>=peers.length)return;
  const t=peers[idx].ord;peers[idx].ord=peers[j].ord;peers[j].ord=t;
  save();renderLinia();
}

  if(liniaIdx<0){const t=new Date();t.setHours(12,0,0,0);let idx=0;for(let i=0;i<seasons.length;i++){const R=seaRange(seasons[i]);if(R&&t>=R.start&&t<R.end){idx=i;break;}if(R&&t>=R.start)idx=i;}liniaIdx=idx;}
  if(liniaIdx>=seasons.length)liniaIdx=seasons.length-1;if(liniaIdx<0)liniaIdx=0;
  const s=seasons[liniaIdx];const R=seaRange(s);tlDefaultDate=R?_iso(R.start):(s.dataJornada||'');

  const jl=L?(L.phase==='live'?'Jornada '+L.jornada+'/14 · en curs':L.phase==='upcoming'?'pendent':L.phase==='off'?'off-season':'acabada'):(s.estat||'');
  const items=(state.timeline||[]);const mine=items.filter(x=>itemSeaIdx(x,seasons)===liniaIdx);

  const dots=seasons.map((_,i)=>`<i class="${i===liniaIdx?'on':''}" onclick="goSeason(${i})"></i>`).join('');

      <div class="lp-pt"><div class="t1">🗓️ T${s.temporada}${s.divisio?' · '+esc(s.divisio):''}</div><div class="t2">${esc(jl)}</div></div>
      <button class="lp-arrow" ${isLast?'disabled':''} onclick="nextSeason()">›</button></div>

      ${s.competicio?`<div class="lp-obj">🏆 ${esc(s.competicio)}</div>`:''}
      <div class="cal-toggle"><button class="${liniaView==='list'?'on':''}" onclick="setLiniaView('list')">Llista</button><button class="${liniaView==='cal'?'on':''}" onclick="setLiniaView('cal')">Calendari</button></div>
      ${liniaView==='cal'?renderSeasonCalendar(s):(ordered.length?ordered.map(function(x){return x.kind==='train'?phaseCardHTML(x,s.id):(x.kind==='note'?noteCardHTML(x,s.id):tradeCardHTML(x,s.id));}).join(''):'<div class="lp-empty">Cap element. Afegeix-ne amb + Element.</div>')}
      <div class="lp-actions"><button class="mini seaedit" onclick="editSeason('${s.id}')">✎ Edita temporada</button><button class="mini del" onclick="delSeasonTL('${s.id}')">Elimina</button></div>
    </div>
    ${elClip?`<div style="display:flex;gap:8px;margin-top:4px"><button class="tl-add" style="flex:1;margin:0;border-color:rgba(70,180,207,.55);color:#bfe9f3" onclick="pasteElement()">📋 Enganxa «${esc(elClipLabel())}» a T${s.temporada}</button><button class="mini del" style="flex:none" onclick="clearElClip()" title="Descarta">✕</button></div>`:''}
    ${isLast?`<button class="tl-add" style="border-color:rgba(228,171,61,.5);color:#e4ab3d" onclick="defineNextSeason()">＋ Definir següent temporada</button>`:''}`;
  renderAvisosTab();
}

function addTimelineItem(){
  document.getElementById('sheet-title').textContent='Afegeix a la línia';
  document.getElementById('sheet-body').innerHTML=`
    <button class="tl-type" onclick="closeSheet();editSeason()">🗓️ Temporada</button>
    <button class="tl-type" onclick="closeSheet();editTrain()"><span class="cone"><i></i></span> Entrenament</button>
    <button class="tl-type" onclick="closeSheet();editSale()">💰 Venda</button>
    <button class="tl-type" onclick="closeSheet();editBuy()">➕ Fitxatge</button>
    <button class="tl-type" onclick="closeSheet();editNote()">📝 Nota</button>`;
  sheetSave=null;
  document.querySelector('.sheet-actions .save').style.display='none';
  document.getElementById('ov').classList.add('on');
}
function tlSave(id,obj){if(!state.timeline)state.timeline=[];if(id){Object.assign(state.timeline.find(x=>x.id===id),obj);}else{state.timeline.push({id:uid(),...obj});}save();renderLinia();}
function editTimeline(id){const x=(state.timeline||[]).find(i=>i.id===id);if(!x)return;
  if(x.kind==='train')editTrain(id);else if(x.kind==='sale')editSale(id);else if(x.kind==='buy')editBuy(id);else editNote(id);}
function delTimeline(id){confirmSheet('Eliminar aquest element?',async()=>{state.timeline=(state.timeline||[]).filter(x=>x.id!==id);await save();renderLinia();});}
function delSeasonTL(id){confirmSheet('Eliminar aquesta temporada de la línia?',async()=>{state.seasons=state.seasons.filter(s=>s.id!==id);await save();renderLinia();});}
function defineSeason(temp,dateISO){const s={id:uid(),title:'Temporada '+temp,estat:'Propera',temporada:temp,divisio:'',jornada:1,dataJornada:dateISO,competicio:''};state.seasons.push(s);save();editSeason(s.id);}
function defineNextSeason(){const anch=state.seasons.filter(s=>s.dataJornada&&s.jornada&&s.temporada).sort((a,b)=>(+a.temporada)-(+b.temporada));if(anch.length){const last=anch[anch.length-1];const D=seasonDates(last);defineSeason((+last.temporada)+1,_iso(D.nextStart));}else{editSeason();}}

function nextTrainStartISO(){
  const trains=(state.timeline||[]).filter(x=>x.kind==='train'&&x.date&&x.setmanes);
  if(trains.length){
    let best=null,bestEnd=null;
    trains.forEach(x=>{const end=_add(_sat(x.date),(+x.setmanes||0)*7);if(!bestEnd||end>bestEnd){bestEnd=end;best=x;}});
    return _iso(bestEnd);
  }
  if(tlDefaultDate)return tlDefaultDate;
  const s=ordSeasons()[liniaIdx]||ordSeasons()[0];const R=s?seaRange(s):null;
  return R?_iso(R.start):_iso(new Date());
}
function splitTrainPhase(ph,depth){
  depth=depth||0; if(depth>8)return;
  if(!ph.date||!ph.setmanes)return;
  const seasons=ordSeasons();let si=-1;const pd=new Date(ph.date+'T12:00:00');
  for(let i=0;i<seasons.length;i++){const R=seaRange(seasons[i]);if(R&&pd>=R.start&&pd<R.end){si=i;break;}}
  if(si<0)return;
  const R=seaRange(seasons[si]);
  const fitWeeks=Math.max(0,Math.round((R.end-pd)/6048e5));
  if((+ph.setmanes)<=fitWeeks)return;
  const remaining=(+ph.setmanes)-fitWeeks;
  ph.setmanes=fitWeeks;
  let next=seasons[si+1];
  if(!next){const last=seasons[si];const D=seasonDates(last);
    next={id:uid(),title:'Temporada '+((+last.temporada)+1),estat:'Propera',temporada:(+last.temporada)+1,divisio:'',jornada:1,dataJornada:_iso(D.nextStart),competicio:''};
    state.seasons.push(next);}
  const nr=seaRange(next);const nStart=nr?_iso(nr.start):next.dataJornada;
  const cont={id:uid(),kind:'train',trainType:ph.trainType,setmanes:remaining,date:nStart,alert:0};
  state.timeline.push(cont);
  splitTrainPhase(cont,depth+1);
}

  openSheet(id?'Edita entrenament':'Nou entrenament',[
    {k:'trainType',lab:'Tipus',type:'select',opts:[['gk','Porteria'],['def','Defensa'],['pm','Creativitat'],['wing','Extrem'],['pass','Passades'],['sco','Anotació'],['setp','Pilota aturada']]},
    {k:'setmanes',lab:'Setmanes',type:'select',opts:wkOpts()},

    {k:'date',lab:'Data d\'inici',type:'date'},
    {k:'alert',lab:'Avís',type:'select',opts:ALERT_OPTS}
  ],{trainType:x.trainType,setmanes:x.setmanes,jornada:'',date:x.date,alert:String(x.alert||0)},async(o)=>{
    let ph;const date=o.jornada?jornToDate(o.jornada):o.date;
    if(id){ph=state.timeline.find(i=>i.id===id);Object.assign(ph,{kind:'train',trainType:o.trainType,setmanes:+o.setmanes,date:date,alert:+o.alert});}
    else{ph={id:uid(),kind:'train',trainType:o.trainType,setmanes:+o.setmanes,date:date,alert:+o.alert};state.timeline.push(ph);}
    splitTrainPhase(ph);
    await save();renderLinia();
  });}

const TRAIN_SKILL={gk:'por',def:'def',pm:'cre',wing:'ext',pass:'pas',sco:'ano',setp:'pa'};
const SKILL_MULT={por:0.78,def:1.25,cre:1.05,ext:0.72,pas:1.15,ano:1.00,pa:1.40};
const SKILL_ORDER=['por','def','cre','ext','pas','ano','pa'];
const SKILL_LAB={por:'Porteria',def:'Defensa',cre:'Creativitat',ext:'Extrem',pas:'Passades',ano:'Anotació',pa:'Pilota at.'};
const LVLNAME=['inexistent','desastrós','horrible','pobre','dèbil','insuficient','acceptable','notable','excel·lent','formidable','destacat','brillant','magnífic','classe mundial','sobrenatural','titànic','extraterrestre','mític','màgic','utòpic','diví'];
function baseWeeks(level){return 0.71*Math.pow(1.18,Math.max(0,level));}
function ageMult(a){a=Math.max(17,a);return 1+0.05*(a-17)+0.02*Math.pow(Math.max(0,a-23),2);}
function coachMult(){const c=state.coach||{};const tr=+c.trainer||5,a1=+c.a1||0,a2=+c.a2||0;const score=tr+0.4*(a1+a2);return (5+0.4*10)/Math.max(1,score);}
function editCoach(){const c=state.coach||{trainer:5,a1:5,a2:5};openSheet('Personal · entrenador i assistents',[{k:'trainer',lab:'Entrenador (cons)',type:'select',opts:coneOpts(1,5)},{k:'a1',lab:'Assistent 1 (cons)',type:'select',opts:coneOpts(0,5)},{k:'a2',lab:'Assistent 2 (cons)',type:'select',opts:coneOpts(0,5)}],{trainer:c.trainer,a1:c.a1,a2:c.a2},async(o)=>{state.coach={trainer:+o.trainer||5,a1:+o.a1||0,a2:+o.a2||0};await save();});}
function parseAge(e){const m=(''+ (e||'')).match(/\d+/);return m?+m[0]:20;}
function parseAgeYD(e){e=''+(e||'');const my=e.match(/(\d+)\s*(?:a|any)/i);const md=e.match(/(\d+)\s*(?:d|die)/i);return {Y:my?+my[1]:20,D:md?+md[1]:0};}
function ageAtISO(edat,iso){const{Y,D}=parseAgeYD(edat);const today=new Date();today.setHours(12,0,0,0);const days=Math.max(0,Math.round((new Date(iso+'T12:00:00')-today)/864e5));const t=Y*112+D+days;return Math.floor(t/112)+'a '+(t%112)+'d';}
function playerRateInPhase(pl,ph){let rate=0;if(!ph.lineups)return 0;['lliga','copa'].forEach(m=>{const lu=ph.lineups[m];if(!lu||!lu.slots)return;Object.entries(lu.slots).forEach(([sid,d])=>{if(d&&d.playerId===pl.id){const a=BOARD.find(x=>x[0]===sid);const pct=a?slotPct(a[1],ph.trainType):0;if(pct>rate)rate=pct;}});});return rate;}
function projectPlayer(pl,fromISO,toISO){
  const sk={};SKILL_ORDER.forEach(k=>{sk[k]={lvl:+(pl[k]||0),prog:0};});
  const preW=fromISO?Math.max(0,(new Date(fromISO+'T12:00:00')-new Date())/6048e5):0;
  const startAge=parseAge(pl.edat)+preW/16;
  const phases=(state.timeline||[]).filter(x=>x.kind==='train'&&x.trainType&&x.setmanes&&(!fromISO||!x.date||x.date>=fromISO)&&(!toISO||!x.date||x.date<toISO)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let weeks=0;
  phases.forEach(ph=>{
    const wks=+ph.setmanes||0;const key=TRAIN_SKILL[ph.trainType];const rate=playerRateInPhase(pl,ph);
    for(let w=0;w<wks;w++){
      if(key&&rate>0&&sk[key]){
        const ageNow=startAge+weeks/16;const af=ageMult(ageNow);const rf=rate===50?2:1;
        const bw=baseWeeks(sk[key].lvl)*(SKILL_MULT[key]||1)*af*rf*coachMult();
        sk[key].prog+=1/bw;
        while(sk[key].prog>=1&&sk[key].lvl<20){sk[key].lvl++;sk[key].prog-=1;}
        if(sk[key].lvl>=20)sk[key].prog=Math.min(sk[key].prog,0.999);
      }
      weeks++;
    }
  });
  return {sk,startAge,endAge:startAge+weeks/16,weeks};
}
function openStats(id,seasonId,mode,sid,role){
  mode=mode||'now';
  const pl=state.players.find(p=>p.id===id);if(!pl)return;
  const s=seasonId?state.seasons.find(x=>x.id===seasonId):null;
  const R=s?seaRange(s):null;
  const startISO=R?_iso(R.start):'', endISO=R?_iso(R.end):'';
  const ach=(mode==='plan')?projectPlayer(pl,'',startISO):null;
  const proj=(mode==='plan')?projectPlayer(pl,'',endISO):null;
  const rows=SKILL_ORDER.map(k=>{
    const cur=+(pl[k]||0);
    let achLvl,achFrac,projFrac;
    if(mode==='plan'){achLvl=ach.sk[k].lvl;achFrac=ach.sk[k].lvl+ach.sk[k].prog;projFrac=proj.sk[k].lvl+proj.sk[k].prog;}
    else {achLvl=cur;achFrac=cur;projFrac=cur;}
    const greenW=Math.min(100,achFrac/20*100);
    const yellowW=Math.max(0,Math.min(100,projFrac/20*100)-greenW);
    const gain=(mode==='plan')?(proj.sk[k].lvl-achLvl):0;
    const plus=(mode==='plan')?(gain>0?('+'+gain):((projFrac-achFrac>0.03&&proj.sk[k].lvl<20)?('+'+Math.round((projFrac-achFrac)*100)+'%'):'')):'';
    return `<div class="pj-row"><span class="pj-lab">${SKILL_LAB[k]}</span>
      <div class="pj-bar"><div class="pj-fill" style="width:${greenW}%"></div><div class="pj-gain" style="left:${greenW}%;width:${yellowW}%"></div></div>
      <span class="pj-lname">${achLvl>0?(LVLNAME[achLvl]||''):'—'}</span><span class="pj-num">${achLvl||'–'}</span><span class="pj-plus">${plus}</span></div>`;
  }).join('');
  const trained=R?(state.timeline||[]).some(x=>x.kind==='train'&&x.date&&x.date>=startISO&&x.date<endISO&&playerRateInPhase(pl,x)>0):false;
  const sc=seasonId||'';
  const ex=sid?(",'"+sid+"','"+role+"'"):'';
  let planEnd=startISO;
  if(mode==='plan'&&R){(state.timeline||[]).forEach(x=>{if(x.kind==='train'&&x.date&&x.date>=startISO&&x.date<endISO&&x.setmanes){const e=_iso(_add(_sat(x.date),(+x.setmanes)*7));if(e>planEnd)planEnd=e;}});}
  const ageStr=(mode==='plan'&&R)?ageAtISO(pl.edat,planEnd):(pl.edat||'');
  const wageObj=(mode==='plan')?(()=>{const o={edat:ageStr,estranger:pl.estranger};SKILL_ORDER.forEach(k=>{o[k]=proj.sk[k].lvl;});return o;})():pl;
  document.getElementById('sheet-title').textContent='Estadístiques';
  document.getElementById('sheet-body').innerHTML=`
    <div class="pj-hd">${pl.home?'<span class="heart">♥</span> ':''}${esc(pl.nom)}${pl.planned?' <span class="tagp">a fitxar</span>':''}<span class="pj-age">${esc(ageStr)}</span></div>
    ${(pl.esp&&pl.esp!=='—'&&pl.esp!=='')?`<div class="pj-esp">${espIcon(pl.esp)}<span>${esc(pl.esp)}</span></div>`:''}
    <div class="pj-toggle"><button class="${mode==='now'?'on':''}" onclick="openStats('${id}','${sc}','now'${ex})">Ara</button><button class="${mode==='plan'?'on':''}" onclick="openStats('${id}','${sc}','plan'${ex})">Projecció</button></div>
    ${mode==='plan'?`<div class="pj-tag"><span style="color:#5a9a34">verd</span> = assolit (temporades anteriors) · <span style="color:#e4ab3d">groc</span> = puja a ${s?('T'+s.temporada):'aquesta temporada'}</div>`:''}
    ${rows}
    ${(mode==='plan'&&!trained)?'<div class="pj-warn">No entrena en aquesta temporada; posa\'l a l\'alineació d\'una fase per veure el que puja.</div>':''}
    <div class="tl-actions" style="margin-top:12px"><button class="mini" onclick="${pl.planned?`editPlanned('${id}')`:`editPlayer('${id}')`}">✎ Edita jugador</button>${sid?`<button class="mini gc" onclick="openSlot('${sid}','${role}')">Canviar posició</button><button class="mini del" onclick="removeFromLineup('${sid}')">✕ Treu de l'onze</button>`:''}</div>
    <div class="pj-wage">Sou aprox: <b>${fmtEur(approxWage(wageObj))}</b> / setmana ${pl.estranger?'· estranger':'· nacional'}${mode==='plan'?' · projectat':' · actual'}</div>
    <div class="pj-disc">${mode==='plan'?`Estimació (nivell + edat). El verd assumeix fet l'entrenament de les temporades anteriors.`:'Estadístiques actuals (avui).'}</div>`;
  sheetSave=null;
  var sv=document.querySelector('.sheet-actions .save');if(sv)sv.style.display='none';
  document.getElementById('ov').classList.add('on');
}
function openProjection(id,seasonId){openStats(id,seasonId,'plan');}
function renderCurves(){
  const el=document.getElementById('curves');if(!el)return;
  const skills=[['cre','Creativitat','#86c34a'],['def','Defensa','#46b4cf'],['por','Porteria','#e4ab3d'],['ext','Extrem','#ab7ecb']];
  const L0=8,L1=20,W=300,H=170,maxY=28;
  const xw=l=>(l-L0)/(L1-L0)*W, yw=w=>H-Math.min(1,w/maxY)*H;
  let polys='';
  skills.forEach(([k,,col])=>{const pts=[];for(let l=L0;l<=L1;l++){const w=baseWeeks(l)*(SKILL_MULT[k]||1);pts.push(xw(l).toFixed(1)+','+yw(w).toFixed(1));}polys+=`<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${pts.join(' ')}"/>`;});
  const legend=skills.map(([,nm,col])=>`<span class="lg"><span class="dot" style="background:${col}"></span>${nm}</span>`).join('');
  el.innerHTML=`<div class="sec-head" style="margin-bottom:6px"><h2 style="font-size:16px">Corbes d'entrenament</h2></div>
    <div class="curve-card"><div class="curve-legend">${legend}</div>
      <div class="curve-wrap"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${polys}</svg><span class="cy" style="top:0">${maxY}s</span><span class="cy" style="top:50%">${Math.round(maxY/2)}s</span><span class="cy" style="bottom:0">0</span></div>
      <div class="curve-x"><span>nivell 8</span><span>14</span><span>20</span></div>
      <div class="curve-note">Setmanes per pujar cada nivell (jugador jove, coaching màxim). Com més amunt, més lent d'entrenar. Calibrat amb les teves dades reals: Extrem i Porteria ràpides, Creativitat mitjana, Defensa la més lenta.</div></div>`;
}

function hardRefresh(){var b=location.pathname.split('?')[0];location.href=b+'?v='+Date.now();}
function exportBackup(){try{const data=JSON.stringify(state);const b=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ht-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);setSyncStatus('Còpia exportada ✓','ok');}catch(e){setSyncStatus('Error exportant','err');}}
function importBackup(){const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';inp.onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let obj;try{obj=JSON.parse(r.result);}catch(err){setSyncStatus('Fitxer no vàlid','err');return;}if(!obj||!obj.seasons&&!obj.players){setSyncStatus('El fitxer no sembla una còpia','err');return;}confirmSheet('Substituir TOTES les dades per la còpia importada?',async()=>{state=obj;state.timeline=state.timeline||[];await save();render();setSyncStatus('Còpia importada ✓','ok');});};r.readAsText(f);};inp.click();}
function pushSnapshot(){try{const now=Date.now();const last=+(localStorage.getItem('ht_snap_t')||0);if(now-last<5*60000)return;localStorage.setItem('ht_snap_t',''+now);let arr=[];try{arr=JSON.parse(localStorage.getItem('ht_snapshots')||'[]');}catch(e){}arr.push({t:now,data:JSON.stringify(state)});if(arr.length>4)arr=arr.slice(-4);localStorage.setItem('ht_snapshots',JSON.stringify(arr));}catch(e){}}
function restoreSnapshot(){let arr=[];try{arr=JSON.parse(localStorage.getItem('ht_snapshots')||'[]');}catch(e){}if(!arr.length){setSyncStatus('Encara no hi ha còpies locals','err');return;}const last=arr[arr.length-1];confirmSheet("Restaurar la còpia local del "+new Date(last.t).toLocaleString('ca')+'?',async()=>{try{state=JSON.parse(last.data);state.timeline=state.timeline||[];await save();render();setSyncStatus('Còpia local restaurada ✓','ok');}catch(e){setSyncStatus('Error restaurant','err');}});}
(async()=>{await load();state.timeline=state.timeline||[];if(!state.coach||state.coach.a1===undefined)state.coach={trainer:5,a1:5,a2:5};if(autofillSeasonChain())await save();render();renderSyncBtn();if(syncEnabled())pullSync();})();
window.addEventListener('focus',()=>{if(syncEnabled())pullSync();});
